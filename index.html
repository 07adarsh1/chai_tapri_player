      { id: "LOmC1dlZ2BE", title: "Chura Liya Hai Tumne Jo Dil Ko", artist: "Asha Bhosle, Mohd Rafi" }
    ];

    const playlistId = "PLG_VFFHJO2fY";

    let currentTrack = 0;
    let player;
    let isPlaying = false;
    let isLooping = false;
    let isShuffled = false;
    let isMuted = false;
    let previousVolume = 80;
    let progressInterval;
    const bgVideo = document.getElementById('bgVideo');

    function keepBackgroundPlaying() {
      if (!bgVideo) return;
      bgVideo.muted = true;
      bgVideo.loop = true;
      bgVideo.playbackRate = 1;

      if (bgVideo.paused) {
        const tryPlay = () => {
          bgVideo.play().catch(() => {
            setTimeout(tryPlay, 250);
          });
        };
        tryPlay();
      }
    }

    function resumeBackgroundOnUserAction() {
      keepBackgroundPlaying();
    }

    bgVideo?.addEventListener('pause', () => {
      if (!document.hidden) {
        keepBackgroundPlaying();
      }
    });

    window.addEventListener('pointerdown', resumeBackgroundOnUserAction, { passive: true });
    window.addEventListener('touchstart', resumeBackgroundOnUserAction, { passive: true });
    window.addEventListener('keydown', resumeBackgroundOnUserAction, { passive: true });

    setInterval(() => {
      if (!document.hidden) {
        keepBackgroundPlaying();
      }
    }, 900);

    document.getElementById('queueCount').innerText = playlist.length;
    document.getElementById('drawerCount').innerText = playlist.length;

    function renderQueue() {
      const container = document.getElementById('playlistItems');
      container.innerHTML = playlist.map((t, idx) => `
        <div onclick="selectTrack(${idx})" class="p-2.5 rounded-xl border ${idx === currentTrack ? 'bg-amber-500/20 border-amber-400/40 text-amber-200' : 'bg-white/5 border-white/5 text-neutral-300 hover:bg-white/10'} cursor-pointer flex justify-between items-center transition text-xs">
          <div>
            <div class="font-medium">${idx + 1}. ${t.title}</div>
            <div class="text-[11px] text-neutral-400 mt-0.5 mono">${t.artist}</div>
          </div>
          <span class="text-xs">${idx === currentTrack ? '●' : ''}</span>
        </div>
      `).join('');
    }
    renderQueue();

    function toggleDrawer() {
      document.getElementById('queueDrawer').classList.toggle('hidden');
    }

    function toggleShuffle() {
      isShuffled = !isShuffled;
      const btn = document.getElementById('shuffleBtn');
      if (isShuffled) {
        btn.classList.add('text-amber-400', 'bg-amber-400/10');
        btn.classList.remove('text-neutral-400');
      } else {
        btn.classList.remove('text-amber-400', 'bg-amber-400/10');
        btn.classList.add('text-neutral-400');
      }
    }

    function toggleLoop() {
      isLooping = !isLooping;
      const btn = document.getElementById('loopBtn');
      if (isLooping) {
        btn.classList.add('text-amber-400', 'bg-amber-400/10');
        btn.classList.remove('text-neutral-400');
      } else {
        btn.classList.remove('text-amber-400', 'bg-amber-400/10');
        btn.classList.add('text-neutral-400');
      }
    }

    // Volume Slider & Icons
    function changeVolume(val) {
      if (!player || !player.setVolume) return;
      player.setVolume(val);
      updateVolumeIcon(val);
    }

    function updateVolumeIcon(val) {
      const volIcon = document.getElementById('volIcon');
      if (val == 0) {
        isMuted = true;
        volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line>`;
      } else if (val < 50) {
        isMuted = false;
        volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
      } else {
        isMuted = false;
        volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>`;
      }
    }

    function toggleMute() {
      if (!player) return;
      const slider = document.getElementById('volumeSlider');
      if (isMuted) {
        player.unMute();
        player.setVolume(previousVolume);
        slider.value = previousVolume;
        updateVolumeIcon(previousVolume);
        isMuted = false;
      } else {
        previousVolume = slider.value || 80;
        player.mute();
        slider.value = 0;
        updateVolumeIcon(0);
        isMuted = true;
      }
    }

    // ================= REALTIME LISTENER PRESENCE =================
    function getFirebaseConfig() {
      return window.firebaseConfig || window.firebaseConfig || firebaseConfig || {};
    }

    const firebaseReady = !!(
      window.firebase &&
      getFirebaseConfig().apiKey &&
      getFirebaseConfig().apiKey !== "YOUR_API_KEY_HERE" &&
      getFirebaseConfig().apiKey !== "AIzaSyDummyKey" &&
      getFirebaseConfig().databaseURL &&
      getFirebaseConfig().databaseURL !== "https://YOUR-PROJECT-default-rtdb.firebaseio.com"
    );

    function initRealtimePresence() {
      try {
        const config = getFirebaseConfig();
        if (firebaseReady && config && config.apiKey) {
          firebase.initializeApp(config);
          const db = firebase.database();
          const listRef = db.ref("live_listeners");
          const userRef = listRef.push();

          db.ref(".info/connected").on("value", (snap) => {
            if (snap.val() === true) {
              userRef.onDisconnect().remove();
              userRef.set(true);
            }
          });

          listRef.on("value", (snap) => {
            const count = Math.max(1, snap.numChildren() || 1);
            document.getElementById("liveCount").innerText = count;
          });
          return;
        }
      } catch (e) {
        console.log("Using local presence fallback:", e);
      }

      let count = 1;
      document.getElementById("liveCount").innerText = count;
    }
    initRealtimePresence();

    // YouTube API Setup
    function onYouTubeIframeAPIReady() {
      const isLocalHost = window.location.protocol === 'http:' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
      if (isLocalHost) {
        document.getElementById('playerStatus').innerText = 'HTTPS domain required for YouTube playback';
      }

      player = new YT.Player('yt-player', {
        host: 'https://www.youtube-nocookie.com',
        height: '200',
        width: '200',
        videoId: playlist[currentTrack].id,
        playerVars: {
          playsinline: 1,
          controls: 0,
          rel: 0,
          listType: 'playlist',
          list: playlistId,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            keepBackgroundPlaying();
            document.getElementById('playerStatus').innerText = "Ready";
            player.setVolume(80);
            player.loadPlaylist({
              listType: 'playlist',
              list: playlistId,
              index: currentTrack
            });
            updateUI();
          },
          onStateChange: onPlayerStateChange,
          onError: () => {
            console.warn("YouTube player blocked this track. This usually happens on localhost or restricted videos.");
            document.getElementById('playerStatus').innerText = 'Playback blocked by YouTube on localhost';
            if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
              nextTrack();
            }
          }
        }
      });
    }

    function updateUI() {
      const track = playlist[currentTrack];
      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('trackArtist').innerText = track.artist;
      renderQueue();
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        document.getElementById('playerStatus').innerText = "Connecting...";
        player.playVideo();
      }
    }

    function setEqualizerState(active) {
      document.getElementById('eqContainer').style.opacity = active ? '1' : '0.3';
      document.querySelectorAll('.eq-bar').forEach(bar => {
        bar.style.animationPlayState = active ? 'running' : 'paused';
      });
    }

    function onPlayerStateChange(event) {
      const iconContainer = document.getElementById('playIconContainer');
      const status = document.getElementById('playerStatus');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        iconContainer.innerHTML = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
        status.innerText = "Playing";
        setEqualizerState(true);
        startProgress();
      } else if (event.data === YT.PlayerState.BUFFERING) {
        status.innerText = "Buffering...";
      } else {
        isPlaying = false;
        iconContainer.innerHTML = `<svg class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
        status.innerText = "Paused";
        setEqualizerState(false);
        clearInterval(progressInterval);
      }

      if (event.data === YT.PlayerState.ENDED) {
        if (isLooping) loadTrack();
        else nextTrack();
      }
    }

    function nextTrack() {
      resumeBackgroundOnUserAction();
      if (player && player.nextVideo) {
        player.nextVideo();
        currentTrack = (currentTrack + 1) % playlist.length;
        updateUI();
        return;
      }

      if (isShuffled) {
        currentTrack = Math.floor(Math.random() * playlist.length);
      } else {
        currentTrack = (currentTrack + 1) % playlist.length;
      }
      loadTrack();
    }

    function prevTrack() {
      resumeBackgroundOnUserAction();
      if (player && player.previousVideo) {
        player.previousVideo();
        currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
        updateUI();
        return;
      }

      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack();
    }

    function selectTrack(idx) {
      resumeBackgroundOnUserAction();
      currentTrack = idx;
      if (player && player.playVideoAt) {
        player.playVideoAt(idx);
      } else if (player && player.loadVideoById) {
        player.loadVideoById(playlist[idx].id);
      }
      updateUI();
      toggleDrawer();
    }

    function loadTrack() {
      resumeBackgroundOnUserAction();
      updateUI();
      if (player && player.loadPlaylist) {
        player.loadPlaylist({
          listType: 'playlist',
          list: playlistId,
          index: currentTrack
        });
        return;
      }
      if (player && player.loadVideoById) {
        player.loadVideoById(playlist[currentTrack].id);
      }
    }

    function startProgress() {
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (!player || !player.getDuration) return;
        const cur = player.getCurrentTime() || 0;
        const tot = player.getDuration() || 1;
        document.getElementById('progressBar').style.width = (cur / tot) * 100 + '%';
        document.getElementById('currentTime').innerText = format(cur);
        document.getElementById('totalDuration').innerText = format(tot);
      }, 500);
    }

    function seekTrack(e) {
      const rect = document.getElementById('progressContainer').getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      if (player && player.getDuration) {
        player.seekTo(player.getDuration() * percent, true);
      }
    }

    function format(s) {
      if (isNaN(s) || s < 0) return "0:00";
      s = Math.floor(s);
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied! Share it with your chai gang ☕");
    }

    function shareOnX() {
      const text = encodeURIComponent("अपना चाय टपरी ☕📻 - यहाँ चाय, दोस्ती और किस्से मिलते हैं\n\n");
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }
  </script>
</body>
